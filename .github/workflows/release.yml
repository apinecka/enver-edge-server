name: Release

# A release is the tag the export pushes (v<VERSION>). The packages are built here from that tag
# and attested, so anyone can trace an installer Enver serves back to this source:
#   gh attestation verify <package> --repo apinecka/enver-edge-server
on:
  push:
    tags: ['v*']

# Actions are pinned to commits and no dependency's install script runs, since the package job can
# mint attestations.
permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: deb
          - runner: ubuntu-24.04-arm
            target: deb
          - runner: ubuntu-24.04
            target: macos
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run package:${{ matrix.target }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-deploy/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.runner }}-${{ matrix.target }}
          path: dist-deploy/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-deploy
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-deploy
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Built from $GITHUB_SHA. Verify a package with: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
